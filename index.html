<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个用于探索太阳系行星运动的交互式教学模拟器">
  <title>Solar Explorer · 太阳系探索器</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');

    :root {
      color-scheme: dark;
      --ink: #f4f1e8;
      --muted: #9ea8ab;
      --line: rgba(215, 224, 218, .14);
      --panel: rgba(17, 28, 31, .78);
      --panel-strong: #142326;
      --accent: #f2bb67;
      --accent-soft: rgba(242, 187, 103, .15);
      --cyan: #7bc5be;
      --bg: #071114;
      font-family: 'Manrope', 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: var(--bg); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app-shell { min-height: 100vh; overflow: hidden; background: radial-gradient(circle at 52% 45%, #17363a 0, #0a1b20 34%, var(--bg) 76%); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 22px 34px; border-bottom: 1px solid var(--line); background: rgba(7, 17, 20, .72); backdrop-filter: blur(16px); }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; color: #271c0f; background: var(--accent); box-shadow: 0 0 28px rgba(242, 187, 103, .35); font-size: 18px; }
    .eyebrow, .label, .mono { font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .09em; }
    .eyebrow { margin: 0 0 3px; color: var(--accent); font-size: 10px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: -.04em; }
    .top-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: calc(100vh - 81px); }
    .simulation { position: relative; min-height: 700px; border-right: 1px solid var(--line); }
    #space { display: block; width: 100%; height: 100%; min-height: 700px; }
    .sim-overlay { position: absolute; inset: 22px 24px auto; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
    .date-block { pointer-events: auto; }
    .date-block h2 { margin: 4px 0 0; font-size: clamp(24px, 3vw, 38px); letter-spacing: -.06em; }
    .date-block p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .view-toggle { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: rgba(10, 23, 26, .72); pointer-events: auto; }
    .view-toggle button, .ghost-button { border: 0; border-radius: 5px; color: var(--muted); background: transparent; padding: 8px 11px; font-size: 12px; }
    .view-toggle button.active, .view-toggle button:hover, .ghost-button:hover { color: var(--ink); background: var(--accent-soft); }
    .canvas-hint { position: absolute; bottom: 30px; left: 28px; color: rgba(244, 241, 232, .48); font-size: 11px; }
    .control-dock { position: absolute; right: 24px; bottom: 22px; left: 24px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; padding: 14px 17px; border: 1px solid var(--line); border-radius: 10px; background: rgba(13, 27, 30, .88); box-shadow: 0 18px 50px rgba(0,0,0,.24); backdrop-filter: blur(14px); }
    .play-button { display: grid; width: 39px; height: 39px; place-items: center; border: 0; border-radius: 50%; color: #241b0d; background: var(--accent); font-size: 16px; }
    .control-main { min-width: 0; }
    .range-row { display: flex; align-items: center; gap: 12px; }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    .speed { min-width: 82px; color: var(--accent); font-size: 11px; text-align: right; }
    .stepper { display: flex; gap: 6px; }
    .stepper button { border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: transparent; padding: 8px 10px; font-size: 11px; }
    .stepper button:hover { color: var(--ink); border-color: var(--accent); }
    .sidebar { padding: 24px; background: rgba(12, 24, 27, .72); }
    .sidebar-section { padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
    .sidebar-section:last-child { border-bottom: 0; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .section-heading h2 { margin: 0; font-size: 14px; letter-spacing: -.02em; }
    .label { color: var(--muted); font-size: 10px; }
    .planet-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .planet-button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px; border: 1px solid transparent; border-radius: 7px; color: var(--muted); background: transparent; text-align: left; font-size: 12px; }
    .planet-button:hover, .planet-button.selected { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.045); }
    .planet-dot { width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; }
    .info-card { padding: 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
    .planet-title { display: flex; align-items: center; gap: 12px; }
    .planet-title .planet-dot { width: 14px; height: 14px; box-shadow: 0 0 14px currentColor; }
    .planet-title h3 { margin: 0; font-size: 22px; letter-spacing: -.06em; }
    .planet-title p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; margin-top: 20px; }
    .stat-value { margin-top: 4px; color: var(--ink); font-size: 13px; }
    .education { color: #c6d0ce; font-size: 12px; line-height: 1.7; }
    .education strong { color: var(--accent); font-weight: 600; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .switch-row input { accent-color: var(--accent); }
    @media (max-width: 900px) {
      .layout { display: block; }
      .simulation { min-height: 620px; border-right: 0; }
      #space { min-height: 620px; }
      .sidebar { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 22px; }
      .sidebar-section { margin: 0; padding: 0; border: 0; }
      .sidebar-section:last-child { grid-column: 1 / -1; }
    }
    @media (max-width: 620px) {
      .topbar { padding: 17px 18px; }
      .top-meta { display: none; }
      .simulation, #space { min-height: 570px; }
      .sim-overlay { inset: 18px 17px auto; }
      .view-toggle { display: none; }
      .control-dock { right: 14px; bottom: 14px; left: 14px; grid-template-columns: auto 1fr; gap: 12px; }
      .stepper { grid-column: 1 / -1; justify-content: space-between; }
      .stepper button { flex: 1; }
      .sidebar { display: block; padding: 20px 17px; }
      .sidebar-section { padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
      .sidebar-section:last-child { border: 0; }
      .canvas-hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">◉</div>
        <div><p class="eyebrow">Interactive astronomy lab</p><h1>Solar Explorer</h1></div>
      </div>
      <div class="top-meta"><span class="status-dot" aria-hidden="true"></span><span>教学模式 · 开普勒近似模型</span></div>
    </header>
    <main class="layout">
      <section class="simulation" aria-label="太阳系运动模拟画布">
        <canvas id="space"></canvas>
        <div class="sim-overlay">
          <div class="date-block"><p class="eyebrow">Simulation date</p><h2 id="dateLabel">2026 / 09 / 12</h2><p id="dayLabel">第 0 天 · 日心参考系</p></div>
          <div class="view-toggle" aria-label="视图模式"><button class="active" data-view="top">俯视</button><button data-view="tilt">倾斜</button></div>
        </div>
        <div class="canvas-hint">滚轮缩放 · 拖动旋转 · 点击行星查看详情</div>
        <div class="control-dock">
          <button class="play-button" id="playButton" aria-label="播放动画" title="播放动画">▶</button>
          <div class="control-main"><div class="range-row"><input id="timeRange" type="range" min="-365" max="365" value="0" aria-label="模拟时间"><span class="speed" id="speedLabel">1 日 / 秒</span></div></div>
          <div class="stepper"><button id="backButton">− 30 日</button><button id="todayButton">今天</button><button id="forwardButton">+ 30 日</button></div>
        </div>
      </section>
      <aside class="sidebar">
        <section class="sidebar-section">
          <div class="section-heading"><h2>选择天体</h2><span class="label">8 planets</span></div>
          <div class="planet-list" id="planetList"></div>
        </section>
        <section class="sidebar-section">
          <div class="section-heading"><h2>行星档案</h2><button class="ghost-button" id="resetView">重置视角</button></div>
          <div class="info-card" id="infoCard"></div>
        </section>
        <section class="sidebar-section">
          <div class="section-heading"><h2>观察设置</h2><span class="label">Display</span></div>
          <label class="switch-row">显示轨道线 <input id="orbitToggle" type="checkbox" checked></label>
          <label class="switch-row">显示行星标签 <input id="labelToggle" type="checkbox" checked></label>
          <p class="education"><strong>探索提示</strong><br>行星距离和大小经过视觉缩放，便于在同一画面中比较。越靠近太阳的行星，绕行一周所需的时间通常越短。</p>
        </section>
      </aside>
    </main>
  </div>
  <script>
    const planets = [
      { name: '水星', en: 'Mercury', color: '#b7a894', a: .39, e: .206, period: 88, diameter: '4,879 km', type: '岩石行星', fact: '水星是离太阳最近、运行速度最快的行星。' },
      { name: '金星', en: 'Venus', color: '#d8a66c', a: .72, e: .007, period: 224.7, diameter: '12,104 km', type: '岩石行星', fact: '金星拥有太阳系中最浓厚的大气层，表面温度极高。' },
      { name: '地球', en: 'Earth', color: '#61a5c2', a: 1, e: .017, period: 365.25, diameter: '12,742 km', type: '岩石行星', fact: '地球是目前已知唯一拥有生命的行星。' },
      { name: '火星', en: 'Mars', color: '#c66b4d', a: 1.52, e: .093, period: 687, diameter: '6,779 km', type: '岩石行星', fact: '火星的铁氧化物尘埃让它呈现出醒目的红色。' },
      { name: '木星', en: 'Jupiter', color: '#d3ae85', a: 5.2, e: .049, period: 4332.6, diameter: '139,820 km', type: '气态巨行星', fact: '木星是太阳系最大的行星，它的一天只有约 10 小时。' },
      { name: '土星', en: 'Saturn', color: '#d6c18e', a: 9.54, e: .057, period: 10759, diameter: '116,460 km', type: '气态巨行星', fact: '土星拥有由冰块和岩石组成的壮观环系。' },
      { name: '天王星', en: 'Uranus', color: '#8ac8c9', a: 19.19, e: .046, period: 30687, diameter: '50,724 km', type: '冰巨行星', fact: '天王星的自转轴几乎横躺在轨道平面上。' },
      { name: '海王星', en: 'Neptune', color: '#527fbd', a: 30.06, e: .011, period: 60190, diameter: '49,244 km', type: '冰巨行星', fact: '海王星是最遥远的八大行星，拥有太阳系中最快的风。' }
    ];
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    const state = { day: 0, selected: 2, playing: false, view: 'top', showOrbits: true, showLabels: true, zoom: 1, rotation: 0 };
    const startDate = new Date('2026-09-12T00:00:00Z');
    let lastFrame = performance.now();

    function dateAt(day) { const date = new Date(startDate); date.setUTCDate(date.getUTCDate() + day); return date; }
    function formatDate(date) { return `${date.getUTCFullYear()} / ${String(date.getUTCMonth() + 1).padStart(2, '0')} / ${String(date.getUTCDate()).padStart(2, '0')}`; }
    function position(planet, day) {
      const mean = (day / planet.period) * Math.PI * 2 - Math.PI / 2 + planet.a;
      const radius = planet.a * (1 - planet.e * planet.e) / (1 + planet.e * Math.cos(mean));
      return { x: Math.cos(mean) * radius, y: Math.sin(mean) * radius };
    }
    function drawStars(width, height) {
      ctx.fillStyle = '#071114'; ctx.fillRect(0, 0, width, height);
      for (let i = 0; i < 130; i++) { const x = (i * 83) % width; const y = (i * 47) % height; const alpha = .12 + ((i * 17) % 7) / 30; ctx.fillStyle = `rgba(223, 233, 222, ${alpha})`; ctx.fillRect(x, y, i % 5 === 0 ? 2 : 1, i % 5 === 0 ? 2 : 1); }
    }
    function draw() {
      const rect = canvas.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1; const width = rect.width; const height = rect.height;
      if (canvas.width !== width * dpr || canvas.height !== height * dpr) { canvas.width = width * dpr; canvas.height = height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      drawStars(width, height); const cx = width / 2; const cy = height / 2 + 20; const maxRadius = Math.min(width, height) * .39 * state.zoom; const scale = maxRadius / Math.sqrt(30.06);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(state.rotation + (state.view === 'tilt' ? -.25 : 0));
      if (state.showOrbits) planets.forEach(planet => { const radius = Math.sqrt(planet.a) * scale; ctx.beginPath(); ctx.ellipse(0, 0, radius, state.view === 'tilt' ? radius * .64 : radius, 0, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(165, 194, 183, .19)'; ctx.lineWidth = 1; ctx.stroke(); });
      const sunGlow = ctx.createRadialGradient(0, 0, 3, 0, 0, 38); sunGlow.addColorStop(0, '#fff2bb'); sunGlow.addColorStop(1, 'rgba(242, 187, 103, 0)'); ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#f2bb67'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
      planets.forEach((planet, index) => { const p = position(planet, state.day); const x = p.x / Math.sqrt(30.06) * maxRadius; const y = p.y / Math.sqrt(30.06) * maxRadius * (state.view === 'tilt' ? .64 : 1); const size = Math.max(3, Math.min(10, 3 + Math.log(planet.a + 1) * 2)); ctx.beginPath(); ctx.arc(x, y, size + (index === state.selected ? 4 : 0), 0, Math.PI * 2); ctx.strokeStyle = index === state.selected ? 'rgba(242, 187, 103, .8)' : 'transparent'; ctx.lineWidth = 1; ctx.stroke(); ctx.fillStyle = planet.color; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill(); if (state.showLabels) { ctx.fillStyle = index === state.selected ? '#f4f1e8' : 'rgba(244,241,232,.65)'; ctx.font = '11px Manrope'; ctx.fillText(planet.name, x + size + 5, y + 4); } }); ctx.restore();
      updateText();
    }
    function updateText() { const date = dateAt(state.day); document.getElementById('dateLabel').textContent = formatDate(date); document.getElementById('dayLabel').textContent = `${state.day === 0 ? '第 0 天' : `${state.day > 0 ? '+' : ''}${state.day} 天`} · 日心参考系`; document.getElementById('timeRange').value = Math.max(-365, Math.min(365, state.day)); }
    function renderList() { document.getElementById('planetList').innerHTML = planets.map((p, i) => `<button class="planet-button ${i === state.selected ? 'selected' : ''}" data-index="${i}"><span class="planet-dot" style="background:${p.color}"></span>${p.name}</button>`).join(''); document.querySelectorAll('.planet-button').forEach(button => button.addEventListener('click', () => { state.selected = Number(button.dataset.index); renderList(); renderInfo(); draw(); })); }
    function renderInfo() { const p = planets[state.selected]; const current = position(p, state.day); const distance = Math.sqrt(current.x * current.x + current.y * current.y).toFixed(2); document.getElementById('infoCard').innerHTML = `<div class="planet-title"><span class="planet-dot" style="background:${p.color}; color:${p.color}"></span><div><h3>${p.name}</h3><p>${p.en} · ${p.type}</p></div></div><div class="stats"><div><div class="label">直径</div><div class="stat-value">${p.diameter}</div></div><div><div class="label">轨道周期</div><div class="stat-value">${p.period.toLocaleString()} 日</div></div><div><div class="label">当前日距</div><div class="stat-value">${distance} AU</div></div><div><div class="label">半长轴</div><div class="stat-value">${p.a} AU</div></div></div><p class="education" style="margin-bottom:0">${p.fact}</p>`; }
    function selectPlanetAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect(); const width = rect.width; const height = rect.height; const cx = width / 2; const cy = height / 2 + 20; const maxRadius = Math.min(width, height) * .39 * state.zoom; const scale = maxRadius / Math.sqrt(30.06); const angle = state.rotation + (state.view === 'tilt' ? -.25 : 0);
      const cos = Math.cos(-angle); const sin = Math.sin(-angle); const screenX = clientX - rect.left - cx; const screenY = clientY - rect.top - cy; const localX = screenX * cos - screenY * sin; const localY = (screenX * sin + screenY * cos) / (state.view === 'tilt' ? .64 : 1);
      let closestIndex = -1; let closestDistance = Infinity;
      planets.forEach((planet, index) => { const point = position(planet, state.day); const x = point.x / Math.sqrt(30.06) * maxRadius; const y = point.y / Math.sqrt(30.06) * maxRadius; const distance = Math.hypot(localX - x, localY - y); if (distance <= Math.max(14, 3 + Math.log(planet.a + 1) * 2 + 8) && distance < closestDistance) { closestIndex = index; closestDistance = distance; } });
      if (closestIndex >= 0) { state.selected = closestIndex; renderList(); renderInfo(); draw(); }
    }
    function animate(now) { const delta = Math.min(80, now - lastFrame); lastFrame = now; if (state.playing) state.day += delta / 1000; draw(); requestAnimationFrame(animate); }
    document.getElementById('playButton').addEventListener('click', event => { state.playing = !state.playing; event.currentTarget.textContent = state.playing ? 'Ⅱ' : '▶'; event.currentTarget.setAttribute('aria-label', state.playing ? '暂停动画' : '播放动画'); });
    document.getElementById('timeRange').addEventListener('input', event => { state.day = Number(event.target.value); renderInfo(); draw(); });
    document.getElementById('backButton').addEventListener('click', () => { state.day -= 30; renderInfo(); draw(); });
    document.getElementById('forwardButton').addEventListener('click', () => { state.day += 30; renderInfo(); draw(); });
    document.getElementById('todayButton').addEventListener('click', () => { state.day = 0; renderInfo(); draw(); });
    document.getElementById('orbitToggle').addEventListener('change', event => { state.showOrbits = event.target.checked; draw(); });
    document.getElementById('labelToggle').addEventListener('change', event => { state.showLabels = event.target.checked; draw(); });
    document.getElementById('resetView').addEventListener('click', () => { state.zoom = 1; state.rotation = 0; state.view = 'top'; document.querySelectorAll('[data-view]').forEach(button => button.classList.toggle('active', button.dataset.view === 'top')); draw(); });
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => { state.view = button.dataset.view; document.querySelectorAll('[data-view]').forEach(item => item.classList.toggle('active', item === button)); draw(); }));
    canvas.addEventListener('wheel', event => { event.preventDefault(); state.zoom = Math.max(.72, Math.min(1.45, state.zoom - event.deltaY * .0005)); draw(); }, { passive: false });
    let dragging = false; let moved = false; let lastPointerX = 0; let pointerStartX = 0; let pointerStartY = 0;
    canvas.addEventListener('pointerdown', event => { dragging = true; moved = false; lastPointerX = event.clientX; pointerStartX = event.clientX; pointerStartY = event.clientY; canvas.setPointerCapture(event.pointerId); canvas.style.cursor = 'grabbing'; });
    canvas.addEventListener('pointermove', event => { if (!dragging) return; if (Math.hypot(event.clientX - pointerStartX, event.clientY - pointerStartY) > 4) moved = true; state.rotation += (event.clientX - lastPointerX) * .006; lastPointerX = event.clientX; draw(); });
    canvas.addEventListener('pointerup', event => { if (dragging && !moved) selectPlanetAt(event.clientX, event.clientY); dragging = false; canvas.releasePointerCapture(event.pointerId); canvas.style.cursor = 'grab'; });
    canvas.style.cursor = 'grab';
    renderList(); renderInfo(); draw(); requestAnimationFrame(animate);
    window.addEventListener('resize', draw);
  </script>
</body>
</html>
